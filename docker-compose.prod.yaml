# Production: runs the released image from ghcr.io. Configure it in .env
# next to this file (see .env.example and docs/configuration.md).
#
#   docker compose -f docker-compose.prod.yaml up -d
#   APP_VERSION=1.2.3 docker compose -f docker-compose.prod.yaml up -d   # pin a release
#   docker compose -f docker-compose.prod.yaml build   # build the image locally instead

services:
  app:
    image: ghcr.io/romkey/unifi-audit-daemon:${APP_VERSION:-latest}
    build:
      context: .
      target: production
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      # The audit log and contact sheets: back this up.
      - data:/data
    # Least privilege: nothing to write but /tmp and /data, no capabilities.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  data:
