name: Release

# Actions tab -> Release -> Run workflow on main, choosing patch, minor or
# major. It runs CI, then works out the next version from the latest vX.Y.Z
# tag, pushes the production image to ghcr.io, publishes to PyPI (if
# enabled), tags main's commit and creates the GitHub Release. Nothing is
# committed: the version lives in the tags, and is stamped into
# pyproject.toml only for the build.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version to bump (minor resets patch; major resets both)"
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Preview only (no image push, PyPI, tag, or GitHub Release)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  guard:
    name: Only release from main
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run the release from main, not $GITHUB_REF_NAME"
          exit 1

  ci:
    name: CI
    needs: guard
    uses: ./.github/workflows/ci.yaml

  release:
    name: Image and GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
      id-token: write  # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, to find the latest version

      - name: Compute release version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          latest=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          latest=${latest:-v0.0.0}
          IFS=. read -r major minor patch <<< "${latest#v}"
          case "$BUMP" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="$major.$minor.$patch"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "::error::Tag v$version already exists"
            exit 1
          fi
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "image=ghcr.io/${GITHUB_REPOSITORY,,}"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing v$version (latest was $latest)"

      # The package and image report this version; it isn't committed.
      - uses: astral-sh/setup-uv@v10.3.0
      - name: Stamp the version
        id: project
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          uv version --no-sync "$VERSION"
          python3 -c \
            "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['name'])" \
            | sed 's/^/name=/' >> "$GITHUB_OUTPUT"

      # X.Y.Z, X.Y, X (from 1.0.0 on) and latest.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        env:
          TAG: ${{ steps.version.outputs.tag }}
          MAJOR: ${{ !startsWith(steps.version.outputs.tag, 'v0.') }}
        with:
          images: ${{ steps.version.outputs.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }},enable=${{ env.MAJOR }}
            type=raw,value=latest

      - name: Dry run summary
        if: inputs.dry_run
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          echo "Dry run; would publish $TAG with images:"
          echo "$TAGS"

      - if: ${{ !inputs.dry_run }}
        uses: docker/setup-qemu-action@v4
      - if: ${{ !inputs.dry_run }}
        uses: docker/setup-buildx-action@v4
      - if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push the production image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v7
        with:
          context: .
          target: production
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # The two platforms' builds can clash saving the same layer
          # ("failed to reserve cache"). A cache that isn't saved only slows
          # the next build; it mustn't fail the release.
          cache-to: type=gha,mode=max,ignore-error=true
          provenance: mode=max
          sbom: true

      - name: Build the package
        run: uv build

      # Optional: set the repository variable PYPI_PUBLISH to true. Uses
      # PyPI trusted publishing (no secret) unless the PYPI_API_TOKEN
      # secret is set. Files already on PyPI are skipped, so a re-run works.
      - name: Publish to PyPI
        if: ${{ !inputs.dry_run && vars.PYPI_PUBLISH == 'true' }}
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          [ -n "$UV_PUBLISH_TOKEN" ] || unset UV_PUBLISH_TOKEN
          uv publish --check-url https://pypi.org/simple/

      # Tags the commit the release was built from; the stamped
      # pyproject.toml stays in the runner.
      - name: Tag the release commit
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "$TAG" "$GITHUB_SHA"
          git push origin "$TAG"

      # The sdist and wheel go on every release, so pip can install from it
      # whether or not the project is on PyPI.
      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          NAME: ${{ steps.project.outputs.name }}
          PYPI_PUBLISH: ${{ vars.PYPI_PUBLISH }}
        run: |
          {
            printf '**Image:** %s\n' "\`$IMAGE:$VERSION\`"
            if [ "$PYPI_PUBLISH" = true ]; then
              printf '\n**PyPI:** https://pypi.org/project/%s/%s/\n' "$NAME" "$VERSION"
            fi
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --verify-tag --title "$TAG" --generate-notes \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
