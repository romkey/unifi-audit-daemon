[project]
name = "unifi-audit-daemon"
version = "0.2.0"
description = "Syncs UniFi Protect's event history to an append-only audit log, serves it over HTTP, and takes a nightly contact sheet of every camera."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "John Romkey" }]
# Keep in step with .python-version and the Dockerfile's python image.
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pillow>=13.0.0",
  "uiprotect>=23.9.0",
]

[project.urls]
Homepage = "https://github.com/romkey/unifi-audit-daemon"
Changelog = "https://github.com/romkey/unifi-audit-daemon/blob/main/CHANGELOG.md"
Issues = "https://github.com/romkey/unifi-audit-daemon/issues"

[project.scripts]
unifi-audit-daemon = "unifi_audit_daemon.__main__:main"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "pytest>=9.1.1",
  "pytest-cov>=7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff.lint]
select = [
  "E", "W", "F",  # pycodestyle, pyflakes
  "I",            # import order
  "N",            # naming
  "UP",           # modern syntax for requires-python
  "B",            # likely bugs
  "S",            # security
  "C4", "SIM", "RET", "PTH",
  "DTZ",          # timezone-aware datetimes
  "T20",          # no print(); use logging
  "LOG", "G",     # logging calls
  "PT",           # pytest style
  "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is how pytest works
"scripts/**" = ["T20"]  # command-line tools print
"contrib/**" = ["T20"]  # Member Zone programs print their output

[tool.mypy]
strict = true
files = ["src", "tests", "scripts", "contrib"]

[tool.pytest.ini_options]
addopts = ["--cov", "--cov-report=term-missing", "--strict-markers"]
testpaths = ["tests"]
xfail_strict = true

[tool.coverage.run]
source = ["unifi_audit_daemon"]
branch = true

[tool.coverage.report]
fail_under = 80
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
